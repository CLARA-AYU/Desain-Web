<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery Gambar</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background-color: #f9f9f9;
}

h2 {
    margin-top: 20px;
}

.gallery {
    display: flex;
    flex-wrap: wrap;
}

.gallery a {
    width: 25%;
    padding: 10px;
    text-decoration: none;
}

.gallery img {
    width: 100%;
    border-radius: 10px;
    border: 3px solid #ffc0cb;
    transition: 0.3s;
}

.gallery img:hover {
    transform: scale(1.05);
    border-color: hotpink;
}

@media (max-width: 900px) {
    .gallery a {
        width: 50%;
    }
}

@media (max-width: 600px) {
    .gallery a {
        width: 100%;
    }
}
</style>
</head>

<body>

<h2>Gallery Pemandangan</h2>
