<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Section</title>

<style>
body {
    margin: 0;
}

/* HERO */
.hero {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

/* picture harus full */
.hero picture {
    width: 100%;
    height: 100%;
    display: block;
}

/* gambar full cover */
.hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* overlay text */
.hero-text {
    position: absolute;
    inset: 0; /* lebih clean dari top/left */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
    background: rgba(0,0,0,0.25); /* biar teks kebaca */
    padding: 20px;
}

.hero-text h1 {
    font-size: 3rem;
    margin: 0;
}

.hero-text p {
    font-size: 1.2rem;
    margin-top: 10px;
}

/* optional responsiveness text */
@media (max-width: 600px) {
    .hero-text h1 {
        font-size: 2rem;
    }
}
</style>
</head>

<body>

<div class="hero">

    <picture>
        <!-- Desktop -->
        <source 
            srcset="https://images.unsplash.com/photo-1433838552652-f9a46b332c40?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8bGFuZHNjYXBlJTIwd2FsbHBhcGVyfGVufDB8fDB8fHww"
            media="(min-width: 800px)">

        <!-- Tablet -->
        <source 
            srcset="https://images.unsplash.com/photo-1582794543139-8ac9cb0f7b11?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8Zmxvd2Vyc3xlbnwwfHwwfHx8MA%3D%3D"
            media="(min-width: 400px)">

        <!-- Mobile -->
        <img 
            src="https://images.unsplash.com/photo-1535905557558-afc4877a26fc?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTJ8fGxpYnJhcnl8ZW58MHx8MHx8fDA%3D"
            alt="Hero Image">
    </picture>

    <div class="hero-text">
        <h1>Selamat Datang</h1>
        <p>This is Clara Ayu</p>
    </div>

</div>

</body>
</html>
