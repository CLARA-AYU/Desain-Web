<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animasi Praktikum</title>
    <style>
        .navbar{
            position: fixed;
            top: 0;
            width: 100%;
            background: pink;
            color: white;
            text-align: center;
            padding: 15px;
            transition: background-color 0.3s ease;
        }

        .navbar.scrolled{
            background: grey;
        }

        body{
            margin: 0;
            font-family: Arial, sans-serif;
        }

        section{
            padding: 40px;
        }


        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .hero{
            margin-top:80px;
            text-align:center;
            animation: fadeIn 1s ease forwards;
        }
        .container{
            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
        }
        .card{
            width:180px;
            padding:20px;
            border:1px solid #ddd;
            border-radius:10px;
            text-align:center;
            transition:
            transform 0.3s ease,
            box-shadow 0.3s ease,
            background 0.3s ease;
        }
        .card:hover{
            transform:scale(1.05);
            box-shadow:0 10px 20px pink;
            background: white;
        }

        @keyframes spin{
            from{
                transform:rotate(0deg);
            }
            to{
                transform:rotate(360deg);
            }
        }

        .spinner{
            width:50px;
            height:50px;
            border:5px solid #E3F2FD;
            border-top-color:pink;
            border-radius:50%;
            animation: spin 1s linear infinite;
            margin:auto;
        }

        .hidden{
            display:none;
        }

        @keyframes pulse{
            0%{
                transform:scale(1);
            }
            50%{
                transform:scale(1.05);
            }
            100%{
                transform:scale(1);
            }
        }

        .btn{
            display:block;
            margin:30px auto;
            padding:12px 25px;
            border:none;
            border-radius:8px;
            background:pink;
            color:white;
            cursor:pointer;
            animation:pulse 1.5s ease infinite;
            transition:
            transform 0.2s ease,
            background 0.3s ease;
        }

        .btn:hover{
            background: black;
            transform:translateY(-4px);
        }


        @keyframes floating{
            0%,100%{
                transform:translateY(0);
            }
            50%{
                transform:translateY(-20px);
            }
        }

        @keyframes putar{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }

        .bola{
            width: 60px;
            height: 60px;
            background-color: pink;
            margin: 50px auto;
            text-align: center;
            animation: putar 2s linear infinite;
        }

        .spacer{
            height:500px;
        }

    </style>
</head>
<body>
    <div class="navbar">
        Navbar 
    </div>

    <section class="hero">
        <h1>Selamat Datang</h1>
        <p>Praktikum CSS Transition, Transform dan Animation</p>
    </section>

    <section>
        <h2 align="center">Produk</h2>
        <div class="container">
            <div class="card">
                <h3>Produk 1</h3>
                <p>Deskripsi produk</p>
            </div>
            <div class="card">
                <h3>Produk 2</h3>
                <p>Deskripsi produk</p>
            </div>
            <div class="card">
                <h3>Produk 3</h3>
                <p>Deskripsi produk</p>
            </div>
            <div class="card">
                <h3>Produk 4</h3>
                <p>Deskripsi produk</p>
            </div>

        </div>
    </section>

    <section>
        <h2 align="center">Loading Spinner</h2>
        <div class="spinner"></div>
        <div class="spinner hidden"></div> 
    </section>

    <button class="btn">
        Tekan Disini
    </button>
     
    <section>
        <h2 align="center">Animasi Kreatif</h2>
        <div class="bola">kasih paham boss</div>
    </section>

    <div class="spacer"></div>

    <script>
    window.addEventListener("scroll", function(){

        let navbar = document.querySelector(".navbar");

        if(window.scrollY > 50){
            navbar.classList.add("scrolled");
        }else{
            navbar.classList.remove("scrolled");
        }

    });
    </script>
</body>
</html>
