<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulir</title>
</head>

<body>
<header>
    <h2>Form Pemesanan Produk Unggulan Dapur Melted</h2>
</header>

<nav>
    <a href="homepage.html">Beranda</a> |
    <a href="galeri.html">Galeri</a> |
    <a href="formulir.html">Formulir</a>
</nav>

<main>
<section>
<form action="#" method="post" enctype="multipart/form-data" onsubmit="alert('Pesanan berhasil dikirim!')">
    <fieldset>
        <legend>Data Pembeli</legend>

        Nama Lengkap:<br>
        <input type="text" placeholder="Masukkan nama lengkap" required><br><br>

        Email:<br>
        <input type="email" placeholder="Masukkan email" required><br><br>

        Nomor HP:<br>
        <input type="text" placeholder="Masukkan nomor hp"><br><br>

        Jenis Kelamin:<br>
        <input type="radio" name="gender"> Laki-laki
        <input type="radio" name="gender"> Perempuan
        <br><br>
    </fieldset>

    <br>

   
    <fieldset>
        <legend>Data Pesanan</legend>

        Pilih Produk:<br>
        <select>
            <option>-- Pilih Produk --</option>
            <option>Dubai Chewy Cookies</option>
            <option>Saltbread Pistachio Kunafa</option>
            <option>Mochi</option>
            <option>Goguma ppang</option>
        </select><br><br>

        Tambahan Topping:<br>
        <input type="checkbox"> Keju
        <input type="checkbox"> Coklat
        <input type="checkbox"> Tanpa tambahan toping
        <br><br>

        Upload Bukti Pembayaran:<br>
        <input type="file"><br><br>

        Catatan:<br>
        <textarea placeholder="Tulis pesan atau request khusus..."></textarea>
    </fieldset>

    <br>

    <input type="submit" value="Kirim Pesanan">
    <input type="reset" value="Reset">

</form>

</section>
</main>

<footer>
    <p>&copy; 2026 dapurmelted</p>
</footer>

</body>
</html>
